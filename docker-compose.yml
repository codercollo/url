services:

  # Main Go application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_DSN: postgres://urluser:urlpassword@postgres:5432/urldb?sslmode=disable
      REDIS_ADDR: redis:6379
      APP_BASE_URL: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # PostgreSQL database service
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: urluser
      POSTGRES_PASSWORD: urlpassword
      POSTGRES_DB: urldb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U urluser -d urldb" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis caching service
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Database migration service
  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    command: >
      -path=/migrations -database=postgres://urluser:urlpassword@postgres:5432/urldb?sslmode=disable up
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

# Named volumes for persistent storage
volumes:
  postgres_data:
  redis_data:
