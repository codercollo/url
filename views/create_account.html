{{define "title"}}Create Account{{end}}

{{define "body"}}
<h2 class="text-2xl font-bold text-gray-900 mb-1">Create admin account</h2>
<p class="text-gray-500 text-sm mb-8">Register to access the dashboard</p>

<form action="/register" method="POST" class="space-y-4">
    <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required
            placeholder="johndoe"
            class="w-full border border-gray-200 rounded-xl bg-gray-50 px-4 py-3 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
    </div>
    <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required
            placeholder="admin@example.com"
            class="w-full border border-gray-200 rounded-xl bg-gray-50 px-4 py-3 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
    </div>
    <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password"
            required minlength="8" placeholder="Min. 8 characters"
            class="w-full border border-gray-200 rounded-xl bg-gray-50 px-4 py-3 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
    </div>
    <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-black font-semibold rounded-xl px-4 py-3 text-sm transition shadow-sm mt-2">
        Create account →
    </button>
</form>

<p class="mt-6 text-center text-sm text-gray-500">
    Already have an account?
    <a href="/login" class="text-blue-600 hover:text-blue-700 font-semibold transition">Sign in</a>
</p>
{{end}}
