{{define "title"}}Sign In{{end}}

{{define "body"}}
<h2 class="text-2xl font-bold text-gray-900 mb-1">Welcome back</h2>
<p class="text-gray-500 text-sm mb-8">Sign in to your admin account</p>

<form action="/login" method="POST" class="space-y-4">
    <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required
            placeholder="admin@example.com"
            class="w-full border border-gray-200 rounded-xl bg-gray-50 px-4 py-3 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
    </div>
    <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
            placeholder="••••••••"
            class="w-full border border-gray-200 rounded-xl bg-gray-50 px-4 py-3 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
    </div>
    <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-black font-semibold rounded-xl px-4 py-3 text-sm transition shadow-sm mt-2">
        Sign in →
    </button>
</form>

<p class="mt-6 text-center text-sm text-gray-500">
    <a href="/forgot-password" class="text-blue-600 hover:text-blue-700 font-semibold transition">Forgot password?</a>
</p>
<p class="mt-6 text-center text-sm text-gray-500">
    Don't have an account?
    <a href="/register" class="text-blue-600 hover:text-blue-700 font-semibold transition">Create one</a>
</p>
{{end}}
