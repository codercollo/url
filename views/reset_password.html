{{define "title"}}Reset Password{{end}}

{{define "body"}}
<h2 class="text-2xl font-bold text-gray-900 mb-1">Set new password</h2>
<p class="text-gray-500 text-sm mb-8">Choose a strong password for your account.</p>

<form action="/reset-password" method="POST" class="space-y-4">
    <input type="hidden" name="token" value="{{index .Data "token"}}" />
    <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">New password</label>
        <input id="password" name="password" type="password" required minlength="8"
            placeholder="Min. 8 characters"
            class="w-full border border-gray-200 rounded-xl bg-gray-50 px-4 py-3 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
    </div>
    <div>
        <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1.5">Confirm password</label>
        <input id="confirm_password" name="confirm_password" type="password" required minlength="8"
            placeholder="Repeat password"
            class="w-full border border-gray-200 rounded-xl bg-gray-50 px-4 py-3 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
    </div>
    <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-black font-semibold rounded-xl px-4 py-3 text-sm transition shadow-sm">
        Update password →
    </button>
</form>

<p class="mt-6 text-center text-sm text-gray-500">
    <a href="/login" class="text-blue-600 hover:text-blue-700 font-semibold transition">Back to sign in</a>
</p>
{{end}}
