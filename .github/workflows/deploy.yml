# GitHub Actions workflow for building and deploying the application
name: Deploy

# Trigger deployment when code is pushed to main branch
on:
  push:
    branches: [main]

jobs:
  deploy:
    # CI runner environment
    runs-on: ubuntu-latest
    needs: []

    # Deployment steps executed in the job
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/snip-ly:latest
            ${{ secrets.DOCKER_USERNAME }}/snip-ly:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/snip-ly
            docker pull ${{ secrets.DOCKER_USERNAME }}/snip-ly:latest
            docker compose up -d --no-build app
            docker image prune -f
